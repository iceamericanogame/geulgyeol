<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>글결 집필장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* 집필 데스크: 왼쪽 회차 서랍 · 가운데 원고 · 위쪽 탭으로 보드 / 맞춤법 / 기록 */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeeb; --line:#d5ddd9;
  --ink:#1b2321; --ink-2:#5a6864; --ink-3:#8a9893;
  --accent:#2c7366; --accent-ink:#ffffff; --accent-soft:#d6ebe5;
  --danger:#b23c2c; --danger-soft:#f7dcd6; --danger-ink:#8a2a1c;
  --ok-soft:#d9f0e1; --ok-ink:#1d5a37;
  --warn:#b7791f;
  --n0:#fbeeb2; --n1:#f8d5d0; --n2:#d2eadf; --n3:#d0e1f5; --n4:#e1d9f3; --note-ink:#2a2a24;
  --shadow:0 1px 2px rgb(20 40 35 / .08),0 6px 18px rgb(20 40 35 / .08);
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-write:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --f-note:'Gowun Dodum','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121816; --surface:#1a2220; --surface-2:#243029; --line:#2f3b38;
    --ink:#e6ece9; --ink-2:#9aa8a4; --ink-3:#6f7d79;
    --accent:#6cc2b0; --accent-ink:#0d211d; --accent-soft:#21413b;
    --danger:#e57f6e; --danger-soft:#46231d; --danger-ink:#f0a496;
    --ok-soft:#1f3b2a; --ok-ink:#8fd6a8;
    --warn:#e0b25b;
    --n0:#4a4320; --n1:#4d2e2b; --n2:#214034; --n3:#243a52; --n4:#3a3256; --note-ink:#f0efe6;
    --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --surface-2:#243029; --line:#2f3b38;
  --ink:#e6ece9; --ink-2:#9aa8a4; --ink-3:#6f7d79;
  --accent:#6cc2b0; --accent-ink:#0d211d; --accent-soft:#21413b;
  --danger:#e57f6e; --danger-soft:#46231d; --danger-ink:#f0a496;
  --ok-soft:#1f3b2a; --ok-ink:#8fd6a8;
  --warn:#e0b25b;
  --n0:#4a4320; --n1:#4d2e2b; --n2:#214034; --n3:#243a52; --n4:#3a3256; --note-ink:#f0efe6;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 var(--f-ui); -webkit-text-size-adjust:100%;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3,p{margin:0}
.muted{color:var(--ink-2)}
[data-ico]{display:inline-grid;place-items:center}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:flex;min-width:0}
.work{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}

/* 서랍 (회차 목록) */
.drawer{
  position:fixed; z-index:30; left:0;
  top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px);
  width:min(86vw,320px); background:var(--surface); border-right:1px solid var(--line);
  padding:12px 12px 12px max(16px,env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:8px;
  transform:translateX(-102%); transition:transform .2s ease; box-shadow:var(--shadow);
}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;z-index:20;background:rgb(10 20 18 / .45)}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.dr-head h2{font-size:15px;font-weight:600}
.docs{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.doc{display:flex;align-items:center;border-radius:10px}
.doc.on{background:var(--accent-soft)}
.doc-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.doc-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-m{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.doc-del{background:none;border:0;border-radius:8px;min-width:36px;height:36px;color:var(--ink-3);display:grid;place-items:center;font-size:12px;padding:0 6px}
.doc-del:hover{color:var(--danger)}
.doc-del.arm,.btn.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.wk{display:flex;align-items:center;gap:2px;border-radius:10px;margin-top:6px}
.wk.on .wk-t{color:var(--accent)}
.wk-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:left;background:none;border:0;padding:8px 6px}
.wk-main .ic{width:16px;height:16px;color:var(--ink-3)}
.wk-tx{min-width:0;display:flex;flex-direction:column}
.wk-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-m{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wk-btn{background:none;border:0;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;color:var(--ink-3);padding:0 6px;font-size:12px;flex:none;white-space:nowrap}
.wk-btn:hover{color:var(--ink);background:var(--surface-2)}
.wk-btn.arm{background:var(--danger);color:#fff}
.wk-in{flex:1;min-width:0;height:38px;border:1px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px var(--f-ui);padding:0 10px;margin:0 4px}
.doc.sub{margin-left:14px;border-left:1px solid var(--line);border-radius:0 10px 10px 0}
.wk-empty{margin-left:14px;padding:6px 12px;font-size:12.5px;color:var(--ink-3)}
.crumb{font-size:12.5px;color:var(--ink-2);padding-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.dr-total{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:34px;padding:0 10px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{justify-content:flex-start;border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger-o{color:var(--danger)}
.ib{min-width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:inline-grid;place-items:center;padding:0 8px;font-size:13px;font-weight:600}
.ib:disabled{opacity:.4}

/* 상단 */
.top{display:flex;align-items:center;gap:8px;height:48px;flex:none}
.brand{font:600 17px var(--f-write);letter-spacing:.02em}
.spacer{flex:1}
.save{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);min-width:0}
.save span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.save[data-s="ok"] .dot{background:var(--accent)}
.save[data-s="busy"] .dot{background:var(--warn)}
.save[data-s="warn"] .dot{background:var(--danger)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;color:var(--ink-2);font-weight:500;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;padding-top:6px}
.boot{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--ink-2);z-index:5}

/* 쓰기 */
.sheet{width:100%;max-width:46rem;margin-inline:auto;flex:1;min-height:0;display:flex;flex-direction:column}
.ttl{font:600 22px/1.3 var(--f-write);border:0;background:transparent;color:var(--ink);padding:2px 0 4px;width:100%;outline:none}
.ed{flex:1;min-height:0;width:100%;resize:none;border:0;background:transparent;color:var(--ink);padding:8px 0 20px;line-height:1.95;font-size:18px;font-family:var(--f-write);outline:none}
.ed::placeholder,.ttl::placeholder{color:var(--ink-3)}
.wbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0 10px}
.stats{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.store-note{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:46rem;width:100%;margin:0 auto 4px}
.store-note button{background:none;border:0;padding:4px 6px;color:var(--accent);font-weight:600;flex:none}

/* 보드 */
.bd-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0 8px;flex:none}
.sw{display:flex;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button:disabled{opacity:.35}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.hint{font-size:12.5px;color:var(--ink-2);flex:1 1 14rem;min-width:10rem}
.zoom{display:flex;gap:4px;align-items:center}
.zv{min-width:58px;font-size:12.5px;font-variant-numeric:tabular-nums}
.bd{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px;position:relative;overscroll-behavior:contain;touch-action:pan-x pan-y;background-attachment:local;margin-bottom:10px}
.sizer{position:relative}
.cv{position:absolute;left:0;top:0;width:4000px;height:2800px;transform-origin:0 0}
.lnk{position:absolute;left:0;top:0;width:4000px;height:2800px;pointer-events:none;z-index:0}
.ln{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;opacity:.75}
.note{position:absolute;width:200px;border-radius:6px;box-shadow:var(--shadow);color:var(--note-ink);display:flex;flex-direction:column;z-index:1}
.note.sel{outline:2px solid var(--accent);outline-offset:2px}
.grip{height:24px;cursor:grab;touch-action:none;display:grid;place-items:center;background:color-mix(in srgb,var(--note-ink) 9%,transparent);border-radius:6px 6px 0 0}
.grip-dots{width:30px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--note-ink) 30%,transparent)}
.nt{border:0;background:transparent;resize:none;font:16px/1.45 var(--f-note);color:var(--note-ink);padding:8px 10px 12px;outline:none;min-height:64px;width:100%;overflow:hidden;display:block}
.cv.linking .nt{pointer-events:none}
.cv.linking .note{cursor:pointer}
.cv.linking .note:not(.sel):hover{outline:2px dashed var(--accent);outline-offset:2px}
.bd-empty{position:absolute;left:48px;top:48px;width:min(320px,70vw);color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* 맞춤법 */
.sp{width:100%;max-width:46rem;margin-inline:auto;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.sp h3,.hd h3{font-size:16px;font-weight:600;margin-bottom:4px}
.sp-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.callout{background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--ink-2)}
.callout.err{background:var(--danger-soft);color:var(--danger-ink)}
.sp-list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.done{opacity:.6}
.fix{font:16px/1.6 var(--f-write);overflow-wrap:anywhere}
.fix s{background:var(--danger-soft);color:var(--danger-ink);text-decoration-thickness:1px;padding:0 2px;border-radius:3px}
.fix ins{background:var(--ok-soft);color:var(--ok-ink);text-decoration:none;padding:0 2px;border-radius:3px}
.fix .arrow{color:var(--ink-3);padding:0 4px}
.why{font-size:12.5px;color:var(--ink-2)}
.card-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}

/* 기록 */
.hist{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:10px}
.h-list,.h-detail{min-height:0;overflow:auto;min-width:0}
.hist.open .h-list{display:none}
.hist:not(.open) .h-detail{display:none}
@media (min-width:820px){
  .hist{grid-template-columns:300px minmax(0,1fr)}
  .hist .h-list,.hist .h-detail{display:block!important}
  .back{display:none!important}
}
.hd{margin-bottom:8px}
.hd.mt{margin-top:8px}
.lg-del{background:var(--danger-soft)}
.lg-add{background:var(--ok-soft)}
.vlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.vrow{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;width:100%}
.vrow.on{border-color:var(--accent);background:var(--accent-soft)}
.vrow .t1{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.vrow .t2{font-size:12px;color:var(--ink-2);display:flex;gap:8px;font-variant-numeric:tabular-nums}
.up{color:var(--ok-ink)}.dn{color:var(--danger-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.h-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.legend{font-size:12.5px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.diff,.raw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 0;font:15px/1.7 var(--f-write);overflow:auto;max-height:52vh}
.raw{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.dl{display:flex;gap:8px;padding:0 12px;min-width:0}
.dl .sg{width:14px;flex:none;color:var(--ink-3);font-family:var(--f-ui)}
.dl .tx{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1}
.dl.add{background:var(--ok-soft);color:var(--ok-ink)}
.dl.del{background:var(--danger-soft);color:var(--danger-ink)}
.dl.gap{color:var(--ink-3);font:12px/2 var(--f-ui);justify-content:center}
.dl mark{background:color-mix(in srgb,currentColor 22%,transparent);color:inherit;border-radius:3px}
.empty-note{color:var(--ink-2);padding:24px 4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;max-width:min(92vw,28rem);box-shadow:var(--shadow);font-size:13.5px}

@media (min-width:900px){
  .drawer{position:static;transform:none;width:272px;flex:none;box-shadow:none;margin-right:20px;padding:12px 14px 12px 0;border-right:1px solid var(--line);background:transparent;height:100%}
  .scrim{display:none!important}
  #menuBtn{display:none}
  .tab{flex:none;padding:10px 20px}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

<div class="app" id="app">
  <aside class="drawer" id="drawer" aria-label="회차 목록">
    <div class="dr-head"><h2>내 소설</h2><button class="btn sm" id="newWork"><span data-ico="plus"></span>새 소설</button></div>
    <ul class="docs" id="docList"></ul>
    <div class="dr-foot">
      <div class="dr-total" id="drTotal"></div>
      <button class="btn ghost" id="expOne"><span data-ico="download"></span>이 회차 .txt로 받기</button>
      <button class="btn ghost" id="expAll"><span data-ico="download"></span>이 소설 합본 .txt로 받기</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="work">
    <header class="top">
      <button class="ib" id="menuBtn" aria-label="회차 목록 열기" data-ico="menu"></button>
      <div class="brand">글결</div>
      <div class="spacer"></div>
      <div class="save" id="save" data-s="local" aria-live="polite"><i class="dot"></i><span id="saveTxt">불러오는 중…</span></div>
    </header>
    <nav class="tabs" role="tablist" aria-label="작업 화면">
      <button class="tab" role="tab" id="tab-write" data-tab="write" aria-selected="true">쓰기</button>
      <button class="tab" role="tab" id="tab-board" data-tab="board" aria-selected="false">보드</button>
      <button class="tab" role="tab" id="tab-spell" data-tab="spell" aria-selected="false">맞춤법</button>
      <button class="tab" role="tab" id="tab-hist" data-tab="hist" aria-selected="false">기록</button>
    </nav>
    <main>
      <section class="pane" id="pane-write" role="tabpanel" aria-labelledby="tab-write">
        <div class="store-note" id="storeNote" hidden><span id="storeNoteTxt"></span><button id="storeNoteX">닫기</button></div>
        <div class="sheet">
          <div class="crumb" id="crumb"></div>
          <input class="ttl" id="ttl" placeholder="회차 제목" aria-label="회차 제목" autocomplete="off">
          <textarea class="ed" id="ed" placeholder="여기에 이어서 써 보세요. 쓰는 대로 저절로 저장돼요." aria-label="원고" spellcheck="false"></textarea>
          <div class="wbar">
            <div class="stats" id="stats"></div>
            <div class="tools">
              <button class="ib" id="undo" aria-label="실행 취소" data-ico="undo"></button>
              <button class="ib" id="redo" aria-label="다시 실행" data-ico="redo"></button>
              <button class="ib" id="fontMinus" aria-label="글자 작게">가−</button>
              <button class="ib" id="fontPlus" aria-label="글자 크게">가+</button>
              <button class="ib" id="fontFace" aria-label="서체 바꾸기">명조</button>
              <button class="btn sm" id="snapBtn"><span data-ico="clock"></span>기록 남기기</button>
            </div>
          </div>
        </div>
      </section>

      <section class="pane" id="pane-board" role="tabpanel" aria-labelledby="tab-board" hidden>
        <div class="bd-bar">
          <button class="btn accent" id="addNote"><span data-ico="plus"></span>포스트잇</button>
          <div class="sw" id="sw" role="group" aria-label="포스트잇 색"></div>

var verTimer=0;
function snapTick(d){
  clearTimeout(verTimer);
  var last=lastVer(d.id);
  if(last&&Date.now()-last.t>8*60e3){addVersion(d,'auto');return;}
  verTimer=setTimeout(function(){var c=cur();if(c&&c.id===d.id)maybeSnap(d);},30000);
}
function maybeSnap(d){
  var last=lastVer(d.id);
  if(!last&&!d.text.trim()) return null;
  if(last&&Date.now()-last.t<3*60e3) return null;
  return addVersion(d,'auto');
}
function addVersion(d,reason){
  var last=lastVer(d.id);
  if(last&&last.text===d.text&&last.title===d.title) return last;
  var v={id:uid(),docId:d.id,t:Date.now(),title:d.title,text:d.text,reason:reason};
  S.versions.push(v); persistVer(v); pruneVers(d.id); saveLS();
  if(S.prefs.tab==='hist') renderHist();
  return v;
}
function delVersion(v){S.versions=S.versions.filter(function(x){return x!==v;});dbDel('v_'+v.id);}
function pruneVers(docId){
  var list=S.versions.filter(function(v){return v.docId===docId;});
  var over=list.length-40; if(over<=0) return;
  var drop=[];
  list.forEach(function(v){if(drop.length<over&&v.reason==='auto')drop.push(v);});
  list.forEach(function(v){if(drop.length<over&&drop.indexOf(v)<0)drop.push(v);});
  drop.forEach(delVersion);
}
function manualSnap(){
  var d=cur(); if(!d) return;
  var before=lastVer(d.id);
  var v=addVersion(d,'manual');
  if(before&&v===before) toast('같은 내용이 이미 기록돼 있어요');
  else toast('기록에 남겼어요 · '+hm(Date.now()));
}

var ZKEY='gwlt:zoom', zmap={}, zT=0, MINZ=0.15, MAXZ=2;
try{zmap=JSON.parse(localStorage.getItem(ZKEY)||'{}')||{};}catch(_){zmap={};}
function zoom(){return (S&&zmap[boardKey()])||1;}
function saveZoom(){clearTimeout(zT);zT=setTimeout(function(){try{localStorage.setItem(ZKEY,JSON.stringify(zmap));}catch(_){}},400);}
function applyZoom(){
  var z=zoom();
  cv.style.transform='scale('+z+')';
  sizer.style.width=(CW*z)+'px'; sizer.style.height=(CH*z)+'px';
  bd.style.backgroundSize=(22*z)+'px '+(22*z)+'px';
  $('#zVal').textContent=Math.round(z*100)+'%';
}
function setZoom(nz,cx,cy){
  nz=Math.round(Math.max(MINZ,Math.min(MAXZ,nz))*100)/100;
  var z=zoom();
  if(cx==null){cx=bd.clientWidth/2;cy=bd.clientHeight/2;}
  var px=(bd.scrollLeft+cx)/z, py=(bd.scrollTop+cy)/z;
  zmap[boardKey()]=nz; applyZoom();
  bd.scrollLeft=px*nz-cx; bd.scrollTop=py*nz-cy;
  saveZoom();
}
function fitAll(){
  var ns=$$('.note',cv);
  if(!ns.length){zmap[boardKey()]=1;applyZoom();bd.scrollLeft=0;bd.scrollTop=0;saveZoom();return;}
  var x0=1e9,y0=1e9,x1=0,y1=0;
  ns.forEach(function(e){x0=Math.min(x0,e.offsetLeft);y0=Math.min(y0,e.offsetTop);x1=Math.max(x1,e.offsetLeft+e.offsetWidth);y1=Math.max(y1,e.offsetTop+e.offsetHeight);});
  var ww=x1-x0+80, hh=y1-y0+80;
  var nz=Math.floor(Math.max(MINZ,Math.min(1,bd.clientWidth/ww,bd.clientHeight/hh))*100)/100;
  zmap[boardKey()]=nz; applyZoom(); saveZoom();
  bd.scrollLeft=Math.max(0,(x0-40)*nz); bd.scrollTop=Math.max(0,(y0-40)*nz);
}
function renderBoard(){

}

function noteEl(n){

  var ta=h('textarea',{class:'nt',rows:'2',placeholder:'메모를 적어요','aria-label':'포스트잇 내용',spellcheck:'false'});

    var sx=ev.clientX, sy=ev.clientY, ox=n.x, oy=n.y;

function midMark(s,o){
  if(o===undefined||o===s) return [document.createTextNode(s||' ')];
  var p=0; while(p<s.length&&p<o.length&&s[p]===o[p]) p++;
  var q=0; while(q<s.length-p&&q<o.length-p&&s[s.length-1-q]===o[o.length-1-q]) q++;
  var out=[]; if(p) out.push(document.createTextNode(s.slice(0,p)));
  var mid=s.slice(p,s.length-q); if(mid){var m=document.createElement('mark');m.textContent=mid;out.push(m);}
  if(q) out.push(document.createTextNode(s.slice(s.length-q)));
  return out.length?out:[document.createTextNode(' ')];
}
function rowEl(kind,sign,s,other){
  return h('div',{class:'dl '+kind},h('span',{class:'sg',text:sign}),h('span',{class:'tx'},kind==='eq'?(s||' '):midMark(s,other)));

function renderDiff(ops){
  var box=h('div',{class:'diff'}), n=ops.length, keep=new Array(n).fill(false), i, changed=false;
  ops.forEach(function(o,k){if(o.t!=='='){changed=true;for(var j=k-1;j<=k+1;j++)if(j>=0&&j<n)keep[j]=true;}});
  i=0;
  while(i<n){
    if(!keep[i]){
      var j=i; while(j<n&&!keep[j]) j++;
      if(j-i<=1) box.append(rowEl('eq','',ops[i].s));
      else box.append(h('div',{class:'dl gap',text:'… 변경 없는 '+(j-i)+'줄'}));
      i=j; continue;
    }
    var o=ops[i];
    if(o.t==='-'){
      var k=i, dels=[], adds=[];
      while(k<n&&ops[k].t==='-'){dels.push(ops[k].s);k++;}
      while(k<n&&ops[k].t==='+'){adds.push(ops[k].s);k++;}
      dels.forEach(function(s,x){box.append(rowEl('del','−',s,adds[x]));});
      adds.forEach(function(s,x){box.append(rowEl('add','+',s,dels[x]));});
      i=k; continue;
    }
    if(o.t==='+') box.append(rowEl('add','+',o.s)); else box.append(rowEl('eq','',o.s));
    i++;
  }
  return {box:box,changed:changed};
}

  // 서버 내용과 합쳐진 뒤에는 화면을 새로 그린다 (쓰던 중이면 글자 위치는 그대로 둔다)
  if(typing&&d&&ed.value===d.text){renderDrawer();setTab(S.prefs.tab);}
  else showAll();
  showStoreNote(); refreshStatus();
}
boot();
})();
